<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Image mosaic</title>
  <style>
    :root {
      color-scheme: light;
      --page: #ffffff; --ink: #15141b; --muted: #6a6572;
      --panel: rgba(255,255,255,.9);
      --side: linear-gradient(180deg, #f7f7fa, #f1f1f5);
      --stage: radial-gradient(circle at 52% 42%, #ffffff 0, #fbfbfd 46%, #f4f4f8 100%);
      --line: #e2e1e8; --hover: rgba(0,0,0,.05); --press: rgba(0,0,0,.09);
      --accent: #b8860b; --on-accent: #ffffff; --shadow: rgba(20,20,40,.14);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #09080d; --ink: #f7f3ec; --muted: #aaa6b2;
      --panel: rgba(20,18,29,.86);
      --side: linear-gradient(180deg, #16121e, #0d0b12);
      --stage: radial-gradient(circle at 52% 42%, #20182e 0, #100d18 46%, #08070b 100%);
      --line: rgba(255,255,255,.12); --hover: rgba(255,255,255,.08); --press: rgba(255,255,255,.11);
      --accent: #ffcf5c; --on-accent: #17131f; --shadow: rgba(0,0,0,.36);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--page); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    /* Pin the single row, or it auto-sizes to the legend and pushes the stage
       (and the toolbar pinned to its bottom) past the fold. */
    #app { height: 100%; display: grid; grid-template-columns: minmax(0,1fr) 292px; grid-template-rows: minmax(0,100%); }
    #stage { position: relative; min-width: 0; background: var(--stage); }
    canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    canvas.dragging { cursor: grabbing; }
    header { position: absolute; left: 24px; top: 20px; z-index: 2; pointer-events: none; }
    h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(23px, 2.6vw, 40px); font-weight: 500; letter-spacing: -.025em; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .toolbar { position: absolute; z-index: 3; left: 24px; right: 24px; bottom: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 9px; padding: 9px; background: var(--panel); border: 1px solid var(--line); border-radius: 15px; box-shadow: 0 12px 38px var(--shadow); backdrop-filter: blur(16px); }
    button { appearance: none; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: var(--hover); font: inherit; font-size: 12px; padding: 8px 11px; cursor: pointer; }
    button:hover { border-color: var(--muted); background: var(--press); }
    button.active { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
    button:disabled { opacity: .35; cursor: not-allowed; }
    .segmented { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 12px; }
    .segmented button { border: 0; border-radius: 10px; background: transparent; padding: 7px 10px; }
    .segmented button:hover { background: var(--hover); }
    .segmented button.active { color: var(--on-accent); background: var(--accent); }
    .slider { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; }
    .slider span { min-width: 78px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .slider input { appearance: none; width: 96px; height: 4px; border-radius: 3px; background: var(--line); cursor: pointer; }
    .slider input::-webkit-slider-thumb { appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); border: 0; }
    .slider input::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: var(--accent); }
    #tooltip { display: none; position: absolute; z-index: 5; min-width: 190px; pointer-events: none; padding: 11px 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 40px var(--shadow); font-size: 12px; line-height: 1.55; }
    #tooltip strong { font-size: 13px; }
    #tooltip .muted { color: var(--muted); }
    aside { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--side); border-left: 1px solid var(--line); }
    .side-head { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .side-head h2 { margin: 7px 0 4px; font-size: 18px; }
    .side-head p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    #legend { overflow-y: auto; padding: 10px; }
    .row { width: 100%; display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px; margin: 0 0 5px; border: 1px solid transparent; border-radius: 12px; background: transparent; text-align: left; cursor: pointer; color: inherit; }
    .row:hover { border-color: var(--line); background: var(--hover); }
    .row.selected { border-color: var(--region); background: color-mix(in srgb, var(--region) 14%, transparent); }
    .row img { width: 40px; height: 40px; object-fit: cover; border-radius: 50%; border: 2px solid var(--region); background: var(--region); }
    .row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 700; }
    .row-sub { color: var(--muted); font-size: 10px; margin-top: 2px; }
    .row-count { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    #status { position: absolute; right: 16px; bottom: 78px; z-index: 2; color: var(--muted); font-size: 10px; pointer-events: none; }
    @media (max-width: 820px) { #app { grid-template-columns: 1fr; } aside { display: none; } header { left: 16px; top: 14px; } }
  </style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="canvas" aria-label="Interactive image mosaic"></canvas>
    <header><h1 id="title"></h1><p id="subtitle"></p></header>
    <div class="toolbar" aria-label="Mosaic controls">
      <button id="reset">Reset view</button>
      <button id="all" class="active">All regions</button>
      <span class="segmented" role="group" aria-label="Style">
        <button id="stylePaint" class="active" title="Colour each point from the image. The dots stay the picture.">Painted dots</button>
        <button id="styleVeil" title="Lay the image over the dots.">Image overlay</button>
      </span>
      <span class="segmented" role="group" aria-label="Theme">
        <button id="themeLight" title="White background">Light</button>
        <button id="themeDark" title="Dark background">Dark</button>
      </span>
      <label class="slider" title="How much image. Drag to 0 for plain region colours.">
        <span id="photoLabel">Image 90%</span>
        <input id="photo" type="range" min="0" max="100" step="1" value="90" aria-label="Image amount">
      </label>
      <label class="slider" title="Dot size. Smaller dots show finer structure; larger ones make the picture read from further away.">
        <span id="spotLabel">Dots 1.00×</span>
        <input id="spot" type="range" min="30" max="300" step="5" value="100" aria-label="Dot size">
      </label>
      <button id="export">Export PNG</button>
      <span class="slider"><span id="zoomLabel">Zoom 1.0×</span></span>
    </div>
    <div id="tooltip"></div>
    <div id="status"></div>
  </main>
  <aside>
    <div class="side-head">
      <div class="eyebrow">Image assignment</div>
      <h2 id="sideTitle">Regions</h2>
      <p id="sourceNote"></p>
    </div>
    <div id="legend"></div>
  </aside>
</div>
<script>
const DATA = __MOSAIC_DATA__;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', {alpha: false});
const stage = document.getElementById('stage');
const tooltip = document.getElementById('tooltip');
const statusEl = document.getElementById('status');
const zoomLabel = document.getElementById('zoomLabel');
const photoInput = document.getElementById('photo');
const photoLabel = document.getElementById('photoLabel');
const spotInput = document.getElementById('spot');
const spotLabel = document.getElementById('spotLabel');
const paintButton = document.getElementById('stylePaint');
const veilButton = document.getElementById('styleVeil');
const lightButton = document.getElementById('themeLight');
const darkButton = document.getElementById('themeDark');

const overlays = DATA.overlays || [];
const sprites = DATA.sprites || [];
const paint = DATA.paint || {index: '', palettes: []};
const entries = DATA.entries;

const state = {
  zoom: 1, centerX: .5, centerY: .5, selected: -1, dragging: false, lastX: 0, lastY: 0,
  alpha: DATA.meta.photo ?? .9,
  spot: DATA.meta.spotScale ?? 1,
  style: DATA.meta.style || 'paint',
  theme: DATA.meta.theme || 'light',
};
let width = 0, height = 0, dpr = 1, renderQueued = false;
let regionRgb = [], ghostRgb = [];
const art = [], byRegion = entries.map(() => []);
DATA.region.forEach((r, i) => byRegion[r].push(i));

function decodeBytes(encoded) {
  const binary = atob(encoded);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
const hexRgb = hex => [1, 3, 5].map(k => parseInt(hex.substr(k, 2), 16));

// Painted dots are batched by palette entry so a frame sets a few hundred fills
// instead of one per point. Bucket 0 holds everything off the subject.
const paintCodes = paint.index ? decodeBytes(paint.index) : null;
const buckets = entries.map((entry, r) => {
  const palette = paint.palettes[r] || [];
  if (!paintCodes || !palette.length) return null;
  const out = palette.map(() => []);
  for (const i of byRegion[r]) out[Math.min(paintCodes[i], palette.length - 1)].push(i);
  return out;
});
const canPaint = Boolean(paintCodes) && buckets.some(Boolean);

if (!canPaint) state.style = 'veil';
if (!overlays.length && canPaint) state.style = 'paint';
paintButton.disabled = !canPaint;
veilButton.disabled = !overlays.length;

document.getElementById('title').textContent = DATA.meta.title;
document.getElementById('subtitle').textContent = `${DATA.meta.subtitle} · ${DATA.meta.instructions}`;
document.getElementById('sourceNote').textContent = DATA.meta.source;
document.getElementById('sideTitle').textContent =
  DATA.meta.groupLabel === 'region' ? 'Image regions' : 'Clusters';

function loadImage(src) {
  return new Promise(resolve => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => resolve(null);
    image.src = src;
  });
}
const loadAll = () => Promise.all(sprites.map((src, i) => loadImage(src).then(im => { art[i] = im; })));

function buildLegend() {
  const legend = document.getElementById('legend');
  entries.forEach(entry => {
    const row = document.createElement('button');
    row.className = 'row';
    row.dataset.region = entry.region;
    const detail = entry.group
      ? `${entry.group} · ${DATA.meta.groupLabel} ${entry.region}`
      : `${DATA.meta.groupLabel} ${entry.region} · ${entry.source}`;
    row.innerHTML = `<img alt="" src="${entry.src}">`
      + `<div><div class="row-name">${escapeHtml(entry.name)}</div>`
      + `<div class="row-sub">${escapeHtml(detail)}</div></div>`
      + `<div class="row-count">${entry.count.toLocaleString()}</div>`;
    row.addEventListener('click', () => selectRegion(entry.region));
    legend.appendChild(row);
  });
}

const escapeHtml = value => String(value).replace(/[&<>'"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

function applyTheme(name) {
  state.theme = name;
  document.documentElement.dataset.theme = name;
  const spec = DATA.themes[name];
  const page = hexRgb(spec.stage[0]);
  regionRgb = spec.palette.map(hexRgb);
  // The faded colour is recomputed per theme: fading toward the page is what makes
  // a point recede, and the page is white in one theme and near-black in the other.
  ghostRgb = regionRgb.map(c => c.map((v, k) => page[k] + spec.ghost * (v - page[k])));
  document.querySelectorAll('.row').forEach(row => {
    row.style.setProperty('--region', spec.palette[Number(row.dataset.region)]);
  });
  lightButton.classList.toggle('active', name === 'light');
  darkButton.classList.toggle('active', name === 'dark');
  scheduleRender();
}

function selectRegion(region) {
  state.selected = state.selected === region ? -1 : region;
  document.getElementById('all').classList.toggle('active', state.selected < 0);
  document.querySelectorAll('.row').forEach(el =>
    el.classList.toggle('selected', Number(el.dataset.region) === state.selected));
  scheduleRender();
}

function resize() {
  const rect = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = rect.width; height = rect.height;
  canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scheduleRender();
}

const scale = () => Math.min(width, height) * .88 * state.zoom;
const toScreen = (x, y) => { const s = scale(); return [width/2 + (x-state.centerX)*s, height/2 + (y-state.centerY)*s]; };
const toWorld = (px, py) => { const s = scale(); return [state.centerX + (px-width/2)/s, state.centerY + (py-height/2)/s]; };

function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

const mixed = (base, target, amount) => `rgb(${
  base[0] + (target[0]-base[0])*amount | 0},${
  base[1] + (target[1]-base[1])*amount | 0},${
  base[2] + (target[2]-base[2])*amount | 0})`;

function batch(indices, radius, s) {
  let drawn = 0;
  ctx.beginPath();
  for (const i of indices) {
    const px = width/2 + (DATA.x[i]-state.centerX)*s;
    const py = height/2 + (DATA.y[i]-state.centerY)*s;
    if (px < -8 || py < -8 || px > width+8 || py > height+8) continue;
    drawn++;
    ctx.moveTo(px + radius, py); ctx.arc(px, py, radius, 0, Math.PI*2);
  }
  return drawn;
}

function drawDots(radius, s) {
  const painting = state.style === 'paint' && canPaint;
  let visible = 0;
  ctx.globalAlpha = painting ? 1 : (state.selected >= 0 ? .82 : .52);
  for (let r = 0; r < byRegion.length; r++) {
    if (state.selected >= 0 && state.selected !== r) continue;
    const bucket = painting ? buckets[r] : null;
    if (!bucket) {
      visible += batch(byRegion[r], radius, s);
      ctx.fillStyle = `rgb(${regionRgb[r].join(',')})`;
      ctx.fill();
      continue;
    }
    const palette = paint.palettes[r];
    for (let k = 0; k < bucket.length; k++) {
      if (!bucket[k].length) continue;
      visible += batch(bucket[k], radius, s);
      ctx.fillStyle = mixed(regionRgb[r], k === 0 ? ghostRgb[r] : palette[k], state.alpha);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  return visible;
}

function drawOverlays(weight) {
  if (weight <= 0.004) return;
  ctx.save();
  ctx.imageSmoothingQuality = 'high';
  for (const overlay of overlays) {
    const image = art[overlay.art];
    if (!image) continue;
    if (state.selected >= 0 && state.selected !== overlay.region) continue;
    const [x0, y0] = toScreen(overlay.box[0], overlay.box[1]);
    const [x1, y1] = toScreen(overlay.box[2], overlay.box[3]);
    if (x1 < 0 || y1 < 0 || x0 > width || y0 > height) continue;
    ctx.globalAlpha = weight;
    ctx.drawImage(image, x0, y0, x1 - x0, y1 - y0);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function render() {
  const stops = DATA.themes[state.theme].stage;
  const gradient = ctx.createRadialGradient(width*.52, height*.42, 0, width*.52, height*.42, Math.max(width,height)*.72);
  gradient.addColorStop(0, stops[0]); gradient.addColorStop(.52, stops[1]); gradient.addColorStop(1, stops[2]);
  ctx.fillStyle = gradient; ctx.fillRect(0, 0, width, height);

  const s = scale();
  // Painted dots ARE the picture, so their radius tracks zoom to hold coverage
  // steady; under an overlay they are only texture, so a capped radius reads as grain.
  const base = state.style === 'paint' && canPaint
    ? Math.max(1.05, Math.min(30, 1.2 * state.zoom))
    : Math.max(.65, Math.min(2.15, .65 + state.zoom*.12));
  const visible = drawDots(base * state.spot, s);
  if (state.style === 'veil') drawOverlays(state.alpha);

  const amount = Math.round(state.alpha * 100);
  const layer = state.alpha <= 0.004 ? 'plain regions'
    : state.style === 'paint' ? `painted dots ${amount}%` : `image overlay ${amount}%`;
  zoomLabel.textContent = `Zoom ${state.zoom.toFixed(1)}×`;
  statusEl.textContent = `${visible.toLocaleString()} points in view · ${layer}`;
}

function nearest(px, py) {
  const [wx, wy] = toWorld(px, py), reach = 18 / scale();
  let best = -1, bestD = reach * reach;
  const pool = state.selected >= 0 ? byRegion[state.selected] : DATA.x.map((_, i) => i);
  for (const i of pool) {
    const dx = DATA.x[i]-wx, dy = DATA.y[i]-wy, d = dx*dx+dy*dy;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

canvas.addEventListener('wheel', event => {
  event.preventDefault();
  const rect = canvas.getBoundingClientRect(), px = event.clientX-rect.left, py = event.clientY-rect.top;
  const [wx, wy] = toWorld(px, py);
  state.zoom = Math.max(.7, Math.min(40, state.zoom * Math.exp(-event.deltaY*.0015)));
  const s = scale(); state.centerX = wx-(px-width/2)/s; state.centerY = wy-(py-height/2)/s;
  tooltip.style.display = 'none'; scheduleRender();
}, {passive:false});

canvas.addEventListener('pointerdown', event => {
  state.dragging = true; state.lastX = event.clientX; state.lastY = event.clientY;
  canvas.classList.add('dragging'); canvas.setPointerCapture(event.pointerId); tooltip.style.display = 'none';
});
canvas.addEventListener('pointermove', event => {
  if (!state.dragging) return;
  const s = scale(); state.centerX -= (event.clientX-state.lastX)/s; state.centerY -= (event.clientY-state.lastY)/s;
  state.lastX = event.clientX; state.lastY = event.clientY; scheduleRender();
});
canvas.addEventListener('pointerup', event => {
  state.dragging = false; canvas.classList.remove('dragging'); canvas.releasePointerCapture(event.pointerId);
});
canvas.addEventListener('click', event => {
  const rect = canvas.getBoundingClientRect(), px = event.clientX-rect.left, py = event.clientY-rect.top;
  const i = nearest(px, py);
  if (i < 0) { tooltip.style.display = 'none'; return; }
  const entry = entries[DATA.region[i]];
  const rows = (DATA.fields || []).map(f =>
    `<br><span class="muted">${escapeHtml(f.label)}</span> ${escapeHtml(f.values[i])}`).join('');
  tooltip.innerHTML = `<strong style="color:${DATA.themes[state.theme].palette[entry.region]}">${escapeHtml(entry.name)}</strong>`
    + (entry.group ? `<br><span class="muted">${escapeHtml(entry.group)}</span>` : '')
    + `<br><span class="muted">id</span> ${escapeHtml(DATA.id[i])}` + rows;
  tooltip.style.left = `${Math.min(width-215, px+14)}px`;
  tooltip.style.top = `${Math.max(12, py-72)}px`;
  tooltip.style.display = 'block';
});

function resetView() { state.zoom = 1; state.centerX = .5; state.centerY = .5; tooltip.style.display = 'none'; scheduleRender(); }
document.getElementById('reset').addEventListener('click', resetView);
document.getElementById('all').addEventListener('click', () => {
  state.selected = -1;
  document.querySelectorAll('.row').forEach(el => el.classList.remove('selected'));
  document.getElementById('all').classList.add('active');
  scheduleRender();
});
canvas.addEventListener('dblclick', resetView);
window.addEventListener('resize', resize);

function syncPhoto() {
  state.alpha = Number(photoInput.value) / 100;
  photoLabel.textContent = `Image ${photoInput.value}%`;
  scheduleRender();
}
function syncSpot() {
  state.spot = Number(spotInput.value) / 100;
  spotLabel.textContent = `Dots ${state.spot.toFixed(2)}×`;
  scheduleRender();
}
photoInput.addEventListener('input', syncPhoto);
spotInput.addEventListener('input', syncSpot);

function setStyle(style) {
  if (style === 'paint' && !canPaint) return;
  if (style === 'veil' && !overlays.length) return;
  state.style = style;
  paintButton.classList.toggle('active', style === 'paint');
  veilButton.classList.toggle('active', style === 'veil');
  scheduleRender();
}
paintButton.addEventListener('click', () => setStyle('paint'));
veilButton.addEventListener('click', () => setStyle('veil'));
lightButton.addEventListener('click', () => applyTheme('light'));
darkButton.addEventListener('click', () => applyTheme('dark'));

document.getElementById('export').addEventListener('click', () => canvas.toBlob(blob => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'mosaic.png'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}, 'image/png'));

buildLegend();
photoInput.value = Math.round(state.alpha * 100);
spotInput.value = Math.round(state.spot * 100);
syncPhoto();
syncSpot();
setStyle(state.style);
applyTheme(state.theme);
resize();
loadAll().then(scheduleRender);
</script>
</body>
</html>
